# Stagehand deploy agent: example configuration.
#
# Copy this file to /etc/stagehand-deploy-agent/config.yml and edit it, or let
# the stagehand Puppet module write it for you. Check a file before you start
# the service with:
#
#   stagehand-deploy-agent --check-config --config /etc/stagehand-deploy-agent/config.yml
#
# The file is strict: a key the agent does not know, a second YAML document, a
# duration without a unit (write 15m, never 900) or a relative path stops the
# agent starting, and the message names the key. Every key below is shown with
# its default, except the ones that have none and must be set.
#
# "<certname>" below is written literally inside a quoted string so this file
# still parses: replace it with this host's Puppet certname.

server:
  # The interface the mTLS listener binds. Empty means all interfaces.
  address: ""
  # The port the Code Manager pack connects to. 8088 is the pack's default, so
  # no estate setting has to change.
  port: 8088
  tls:
    # This host's own Puppet certificate. Required.
    certificate: "/etc/puppetlabs/puppet/ssl/certs/<certname>.pem"
    # This host's private key. Required. The packaged systemd unit loads it with
    # LoadCredential=, so the agent never needs to read Puppet's private key
    # directory itself. --check-config run by hand cannot see this path and only
    # warns about it.
    key: /run/credentials/stagehand-deploy-agent.service/server.key
    # The estate CA that client certificates must chain to. Required.
    client_ca: /etc/puppetlabs/puppet/ssl/certs/ca.pem
    # The CA's revocation list. A revoked client certificate is refused, and a
    # changed file is re-read within a minute. Leave it out to skip the check.
    crl: /etc/puppetlabs/puppetserver/ca/ca_crl.pem
    # The certnames (certificate Subject CN) allowed to call the API. Required,
    # at least one. Never autosign a certname that is listed here.
    allowed_certnames:
      - stagehand-code-manager
    # Optional extra pin: SHA-256 fingerprints, as `puppetserver ca list --all`
    # prints them. When set, a client certificate must be listed here as well as
    # by certname.
    allowed_fingerprints: []

ops:
  # Where /healthz, /readyz and /metrics are served, over plain HTTP. They have
  # no authentication, so the default is the loopback interface. Anything else
  # is accepted with a warning.
  listen: 127.0.0.1:8089

engine:
  # The deploy tool: r10k or g10k.
  name: r10k
  # The tool's absolute path. On Puppet Core with r10k installed as a gem it is
  # /opt/puppetlabs/puppet/bin/r10k.
  command_path: /opt/puppetlabs/puppet/bin/r10k
  # The tool's own configuration file.
  config_path: /etc/puppetlabs/r10k/r10k.yaml
  # Print the tool's progress, so a failed deploy shows why.
  verbose: true
  # Also deploy each environment's modules.
  deploy_modules: true
  # Run `puppet generate types` after a deploy.
  generate_types: true
  # Deploy only the modules that changed.
  env_incremental: false
  # Use the old --puppetfile flag instead of --modules (very old r10k).
  use_legacy_puppetfile_flag: false
  # An ssh_config for git, passed as `ssh -F <path>`. It is how host keys are
  # pinned. Letters, digits and . _ / - only. Leave it out when the Git remotes
  # need no ssh.
  # ssh_config: /etc/stagehand-deploy-agent/ssh_config

deploys:
  # Where environments live; each environment's deploy marker is read from here.
  environments_dir: /etc/puppetlabs/code/environments
  # Where job records and the deploy lock are kept.
  state_dir: /var/lib/stagehand-deploy-agent
  # How long one environment's deploy may run before it is stopped. A number
  # followed by a unit (s, m, h), at least 1s.
  timeout: 15m
  # Bytes of tool output kept per environment (the end of the output is kept).
  output_limit: 262144
  # How many job records to keep; the oldest finished ones beyond this go.
  max_jobs: 500
  # Environments that may never be removed. Lower-case letters, digits and _.
  protected_environments:
    - production

log:
  # debug, info, warn or error.
  level: info
