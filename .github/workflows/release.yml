name: release

# Release workflow (docs/MAINTAINING.md, "Cut a release").
#
# A tag vX.Y.Z (or vX.Y.Z-rc.N) builds a DRAFT release and publishes it only after
# it verifies the way an operator would verify it (FORK-WR-06: the fork published
# first and verified afterwards, so a failed check left a public, unverified
# release). In order:
#
#   1. refuse a tag that is not on main, test with the race detector;
#   2. goreleaser builds the linux amd64 and arm64 archives, debs and rpms, writes
#      checksums.txt, signs it keyless with cosign (checksums.txt.sigstore.json),
#      writes an SBOM per artifact and creates the GitHub release as a draft;
#   3. verify the signature with the exact workflow identity, check every sha256,
#      attest build provenance;
#   4. build the image from the verified archives, push it, sign the digest and
#      verify that signature with the same identity;
#   5. only then publish the release.
#
# Any failed step stops the run and leaves the draft, which nobody can download
# without write access. Every action is pinned by commit SHA (the comment names
# the version it resolved from); goreleaser itself is pinned to a fixed version.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create and publish the GitHub release
      packages: write      # push ghcr.io/puppet-stagehand/stagehand-deploy-agent
      id-token: write      # OIDC token for cosign keyless signing and the attestation
      attestations: write  # publish the build provenance attestation
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A release must come from main, never from a tag placed on an unreviewed branch.
      - name: Refuse tags that are not on main
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main" >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The 1.25 line, newest patch: the release binary must carry the
          # standard-library security fixes (govulncheck in ci.yml checks the same).
          go-version: "1.25"
          check-latest: true

      - name: Test
        run: |
          go vet ./...
          go test -race -count=1 ./...

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      # Builds everything, signs checksums.txt and creates the release as a draft
      # (release.draft: true in .goreleaser.yml). It pushes no image.
      - name: Run GoReleaser (creates the draft)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "v2.18.0"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fail loudly rather than verify or attest nothing.
      - name: Check the signed checksums file exists
        run: |
          set -euo pipefail
          test -s dist/checksums.txt
          test -s dist/checksums.txt.sigstore.json

      # The check an operator runs before pinning (the release notes show it). If
      # the identity there is wrong, the release stops here.
      - name: Verify the signature as an operator would
        run: |
          set -euo pipefail
          cosign verify-blob \
            --bundle dist/checksums.txt.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/checksums.txt

      # Every file checksums.txt lists must be present and match; a missing file
      # fails, which is stricter than the operator's --ignore-missing.
      - name: Check every sha256
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c checksums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image holds only the binary that was just verified: it is unpacked from
      # the archives whose sha256 the previous steps checked. The Dockerfile has no
      # RUN step, so building arm64 on this amd64 runner needs no emulation.
      - name: Build and push the image
        id: image
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p image-context/amd64 image-context/arm64
          tar -xzf "dist/stagehand-deploy-agent_${version}_linux_amd64.tar.gz" -C image-context/amd64 stagehand-deploy-agent
          tar -xzf "dist/stagehand-deploy-agent_${version}_linux_arm64.tar.gz" -C image-context/arm64 stagehand-deploy-agent
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file Dockerfile \
            --tag "ghcr.io/puppet-stagehand/stagehand-deploy-agent:${version}" \
            --metadata-file "${RUNNER_TEMP}/image-metadata.json" \
            --push \
            image-context
          digest="$(jq -r '."containerimage.digest"' "${RUNNER_TEMP}/image-metadata.json")"
          case "$digest" in
            sha256:????????????????????????????????????????????????????????????????) ;;
            *) echo "::error::buildx reported no image digest (got '${digest}')" >&2; exit 1 ;;
          esac
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign the image by digest
        env:
          IMAGE: ghcr.io/puppet-stagehand/stagehand-deploy-agent@${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE"

      - name: Verify the image signature as an operator would
        env:
          IMAGE: ghcr.io/puppet-stagehand/stagehand-deploy-agent@${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE"

      # The last step. Everything above passed, so the draft becomes public.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
